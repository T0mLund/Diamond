  <meta property="og:title" content="The Diamond">
  <meta property="og:description" content="An interactive 3D model.">

    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>

<body>
  <main id="stage" role="img" aria-label="The Diamond, a 3D model. It opens as a torus; click, tap or press Enter to open it into the diamond. Then drag to orbit, and scroll or pinch to zoom; arrow keys orbit and plus or minus zoom. Zooming in past the innermost sphere carries you into BEING, from where you look out as a light cone: drag or arrow keys to look around, scroll, pinch or plus and minus to narrow or widen the cone, and widen it past its widest to step back out."></main>
  <p id="hint" class="hint" aria-hidden="true">Click or tap to begin</p>
  <p id="caption" class="caption" role="status"><span class="caption__angle">Light cone from BEING <span id="cone-angle" aria-hidden="true">220</span>&deg;</span> Wider: open awareness, up to 220&deg; like human vision. Narrower: focused attention. A design choice that makes a statement about experience.</p>
  <p id="fallback" class="fallback" hidden>The Diamond needs a browser with WebGL enabled.</p>
  <noscript><p class="fallback">The Diamond needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
