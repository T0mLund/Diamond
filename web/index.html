<body>
  <main id="stage" role="img" aria-label="The Diamond, a 3D model. It opens as a torus; click, tap or press Enter to unfold it. Then drag to orbit, and scroll or pinch to zoom; arrow keys orbit and plus or minus zoom. Zooming in past the innermost sphere switches to a view through BEING."></main>
  <div id="porthole" class="porthole" aria-hidden="true"></div>
  <div id="rim" class="rim" aria-hidden="true"></div>
  <p id="hint" class="hint" aria-hidden="true">Click or tap to begin</p>
  <p id="caption" class="caption" role="status">Looking through BEING. Closer, the view widens: open awareness. Farther, it narrows: focused attention. Linking width to attention is this model&rsquo;s own stipulation.</p>
  <p id="fallback" class="fallback" hidden>The Diamond needs a browser with WebGL enabled.</p>
  <noscript><p class="fallback">The Diamond needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="main.js"></script>
