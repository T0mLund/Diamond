name: db-verify

# Sanity-checks the live Supabase schema after a db-push, against
# Spec v3.1 §5 (φ-cascade), §3.1–§3.2 (landmarks) and §9 (schema state,
# fully-private posture).
#
# Runs on workflow_dispatch (so the owner or the assisting agent can
# re-verify any time) and after every successful db-push run.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["db-push"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run verification queries
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          fails=0
          check () {
            local label="$1" sql="$2" expected="$3" got
            got=$(psql "$DB_URL" -At -c "$sql")
            if [ "$got" != "$expected" ]; then
              echo "::error::$label: expected '$expected', got '$got'"
              fails=$((fails + 1))
            else
              echo "✓ $label = $got"
            fi
          }
          HOUSEKEEPING="('spatial_ref_sys','geometry_columns','geography_columns')"
          PHI="((1 + sqrt(5::float8)) / 2)"

          # Structure (Spec §9)
          check "postgis_extension" "select count(*) from pg_extension where extname='postgis';" "1"
          check "diamond_tables"    "select count(*) from pg_tables where schemaname='public' and tablename not in $HOUSEKEEPING;" "13"
          check "no_directus"       "select count(*) from pg_tables where schemaname='public' and tablename like 'directus\_%';" "0"
          check "axes"              "select count(*) from public.axes;" "3"
          check "shells"            "select count(*) from public.shells;" "5"
          check "coordinates"       "select count(*) from public.coordinates;" "9"
          check "zones"             "select count(*) from public.zones;" "4"
          check "sub_zones"         "select count(*) from public.sub_zones;" "80"

          # Fully-private posture (Spec §9; migrations 0010–0016)
          check "rls_everywhere"    "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relname not in $HOUSEKEEPING and not c.relrowsecurity;" "0"
          check "no_policies"       "select count(*) from pg_policies where schemaname='public';" "0"
          check "no_anon_grants"    "select count(*) from information_schema.role_table_grants where table_schema='public' and grantee in ('anon','authenticated') and table_name not in $HOUSEKEEPING;" "0"

          # Geometry (Spec §3, §4.6, §5)
          check "one_origin"        "select count(*) from public.coordinates where is_origin;" "1"
          check "shell_radii_exact" "select count(*) from public.shells where abs(radius::float8 - power($PHI, ord - 3)) > 1e-12;" "0"
          check "landmarks_exact"   "select count(*) from public.coordinates c join (values ('being',0,0,0), ('heaven',1,0,0), ('hell',-1,0,0), ('future',0,1,0), ('past',0,-1,0), ('obliteration',0,0,$PHI), ('awakening',0,0,-$PHI), ('death',0,0,$PHI*$PHI), ('birth',0,0,-$PHI*$PHI)) as e(slug,x,y,z) using (slug) where abs(c.x-e.x) < 1e-12 and abs(c.y-e.y) < 1e-12 and abs(c.z-e.z) < 1e-12;" "9"
          check "birth_death_unzoned" "select count(*) from public.coordinates where slug in ('birth','death') and public.compute_zone(x, y, z) is null;" "2"

          if [ "$fails" -gt 0 ]; then
            echo "::error::$fails invariant(s) failed."; exit 1
          fi
          echo "All invariants hold."
